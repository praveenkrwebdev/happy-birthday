<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horn OK Please — Highway Music</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070707;
  color:#fff;
  overflow-x:hidden;
}

/* ================= HEADER ================= */

header{
  width:100%;
  padding:18px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.8);
  position:relative;
  z-index:10;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:#ff7a00;
}

.clock{
  font-size:14px;
  color:#aaa;
}

/* ================= HERO ================= */

.hero{
  min-height:72vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:50px 20px;
  position:relative;
  overflow:hidden;
}

.hero:before{
  content:"";
  position:absolute;
  width:700px;
  height:700px;
  background:radial-gradient(
    circle,
    rgba(255,122,0,.16),
    transparent 65%
  );
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:850px;
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border:1px solid rgba(255,122,0,.35);
  border-radius:999px;
  color:#ff9d4d;
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:20px;
}

h1{
  font-size:clamp(42px,8vw,90px);
  line-height:.95;
  font-weight:900;
  letter-spacing:-4px;
  text-transform:uppercase;
}

h1 span{
  color:#ff7a00;
}

.subtitle{
  margin-top:22px;
  color:#aaa;
  font-size:17px;
  line-height:1.7;
}

/* ================= MUSIC PANEL ================= */

.music-wrap{
  padding:0 20px 80px;
}

.panel{
  max-width:760px;
  margin:-20px auto 0;
  position:relative;
  z-index:5;
  background:#111;
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:28px;
  box-shadow:0 20px 80px rgba(0,0,0,.5);
  transition:.3s ease;
}

.panel.playing{
  border-color:rgba(255,122,0,.4);
  box-shadow:
    0 20px 80px rgba(0,0,0,.55),
    0 0 50px rgba(255,122,0,.08);
}

.now-playing{
  display:flex;
  align-items:center;
  gap:18px;
}

.cover{
  width:72px;
  height:72px;
  border-radius:18px;
  background:
    linear-gradient(135deg,#ff7a00,#ff3d00);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  flex:none;
}

.info{
  min-width:0;
  flex:1;
}

.song{
  font-size:20px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  color:#999;
  margin-top:5px;
  font-size:14px;
}

/* ================= PROGRESS ================= */

.progress-area{
  margin-top:28px;
}

.track{
  width:100%;
  height:6px;
  border-radius:99px;
  background:#292929;
  cursor:pointer;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  background:#ff7a00;
  border-radius:inherit;
  transition:width .15s linear;
}

.time-row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:11px;
  color:#777;
}

/* ================= CONTROLS ================= */

.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  margin-top:25px;
}

.control{
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.12);
  background:#191919;
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  transition:.2s ease;
}

.control:hover{
  background:#242424;
  transform:translateY(-2px);
}

.control.main{
  width:62px;
  height:62px;
  background:#ff7a00;
  border-color:#ff7a00;
  color:#000;
  font-size:22px;
}

.control.main:hover{
  background:#ff8c24;
}

/* ================= YOUTUBE ================= */

.youtube-player{
  position:absolute;
  width:1px;
  height:1px;
  left:-10000px;
  top:-10000px;
  opacity:0;
  pointer-events:none;
}

/* ================= FOOTER ================= */

footer{
  padding:40px 20px 60px;
  text-align:center;
  color:#555;
  font-size:12px;
}

/* ================= PLAYING ANIMATION ================= */

body.playing .cover{
  animation:coverPulse 1.8s ease-in-out infinite;
}

@keyframes coverPulse{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.04);
  }
}

/* ================= RESPONSIVE ================= */

@media(max-width:600px){

  header{
    padding:16px;
  }

  .hero{
    min-height:65vh;
  }

  h1{
    letter-spacing:-2px;
  }

  .panel{
    padding:20px;
    border-radius:20px;
  }

  .cover{
    width:60px;
    height:60px;
  }

  .song{
    font-size:17px;
  }

}
</style>
</head>

<body>

<header>
  <div class="logo">
    HORN <span>OK</span> PLEASE
  </div>

  <div class="clock" id="clock">
    12:00 am
  </div>
</header>


<section class="hero">

  <div class="hero-content">

    <div class="badge">
      Highway Music
    </div>

    <h1>
      HORN <span>OK</span><br>
      PLEASE
    </h1>

    <p class="subtitle">
      Old-school Bollywood songs for long highway drives,
      roadside chai and endless Indian roads.
    </p>

  </div>

</section>


<section class="music-wrap">

  <div class="panel" id="panel">

    <div class="now-playing">

      <div class="cover">
        🎵
      </div>

      <div class="info">

        <div class="song" id="song">

        class="control main"
        id="play"
        type="button"

      >
        ▶

      <button
        class="control"
        id="next"
        type="button"
        aria-label="Next song"
      >
        ⏭
      </button>

    </div>

  </div>

</section>


<footer>
  Drive safe. Enjoy the music. 🚚
</footer>

-->
<div
  id="yt"
  class="youtube-player"
  aria-hidden="true"
></div>


<script>

/* =========================================================

       RDxxxxxxxxxxx

   as a normal playlist ID.

   The first video is:
       5MIGQBpVeqs

   This is being used to test the player independently
   from the Radio/Mix URL.
========================================================= */

const SONGS = [

  {
    id: "5MIGQBpVeqs",
    title: "Mujhse Mohabbat Ka",
    artist: "Kumar Sanu"
  },

  {
    id: "Q97LLDLxE98",

  },

  },

  {

  },

  {
    id: "ER7RoDTT2_4",
    title: "Barsaat Ke Mausam Mein",
    artist: "Kumar Sanu"
  },

  {
    id: "eLzEykVMZn0",
    title: "Ae Kash Ke Hum",

  },

  {
    id: "2LFNbp2_NNY",

  },

  {
    id: "qDIQ6HXu5Rg",
    title: "Aksar Is Duniya Mein",
    artist: "Alka Yagnik"
  },

  }

];


/* =========================================================
   PLAYER VARIABLES
========================================================= */

let player = null;
let ready = false;
let currentIndex = 0;
let timer = null;


/* =========================================================
   LOAD YOUTUBE IFRAME API
========================================================= */

function loadYouTubeAPI(){

  /*
   * If the API has already loaded, create the player immediately.
   */

  if(window.YT && window.YT.Player){

    createPlayer();

    return;
  }


  /*
   * YouTube calls this global function automatically
   * after the API has finished loading.
   */

  window.onYouTubeIframeAPIReady = function(){

    createPlayer();

  };


  /*
   * Load the API only once.
   */

  if(
    !document.querySelector(
      'script[src="https://www.youtube.com/iframe_api"]'
    )
  ){

    const script =
      document.createElement("script");

    script.src =
      "https://www.youtube.com/iframe_api";

    script.async = true;

    document.head.appendChild(script);

  }

}


/* =========================================================
   CREATE PLAYER
========================================================= */

function createPlayer(){

  if(player){

    return;
  }


  player = new YT.Player(
    "yt",
    {

      width:"1",

      height:"1",

      videoId:
        SONGS[currentIndex].id,


      playerVars:{
        autoplay:0,
        controls:0,
        disablekb:1,
        playsinline:1,
        rel:0,
        modestbranding:1,
        iv_load_policy:3
      },


      events:{

        onReady:function(){

          ready = true;

          updateSong();

          document
            .getElementById("play")
            .textContent = "▶";

          console.log(
            "YouTube player ready"
          );

        },


        onStateChange:function(event){

          const state =
            event.data;


          /*
           * Playing
           */

          if(
            state ===
            YT.PlayerState.PLAYING
          ){

            document
              .body
              .classList
              .add("playing");

            document
              .getElementById("panel")
              .classList
              .add("playing");

            document
              .getElementById("play")
              .textContent = "⏸";

            startTimer();

          }


          /*
           * Paused
           */

          else if(
            state ===
            YT.PlayerState.PAUSED
          ){

            document
              .body
              .classList
              .remove("playing");

            document
              .getElementById("panel")
              .classList
              .remove("playing");

            document
              .getElementById("play")
              .textContent = "▶";

            stopTimer();

          }


          /*
           * Video ended
           */

          else if(
            state ===
            YT.PlayerState.ENDED
          ){

            stopTimer();

            goTo(
              currentIndex + 1,
              true
            );

          }

        },


        /*
         * YouTube errors
         */

        onError:function(event){

          const errors = {

            2:
              "Invalid YouTube video ID.",

            5:
              "YouTube HTML5 player error.",

            100:
              "Video unavailable or private.",

            101:
              "This video does not allow embedded playback.",

            150:
              "This video does not allow embedded playback."

          };


          const message =
            errors[event.data] ||
            "YouTube playback error.";


          document
            .getElementById("song")
            .textContent =
              message;


          document
            .getElementById("artist")
            .textContent =
              "YouTube error " +
              event.data;


          document
            .getElementById("play")
            .textContent = "▶";


          document
            .body
            .classList
            .remove("playing");


          document
            .getElementById("panel")
            .classList
            .remove("playing");


          stopTimer();


          console.error(
            "YouTube error:",
            event.data,
            message
          );

        }

      }

    }
  );

}


/* =========================================================
   UPDATE SONG INFORMATION
========================================================= */

function updateSong(){

  const song =
    SONGS[currentIndex];


  document
    .getElementById("song")
    .textContent =
      song.title;


  document
    .getElementById("artist")
    .textContent =
      song.artist;


  document
    .getElementById("cur")
    .textContent =
      "0:00";


  document
    .getElementById("dur")
    .textContent =
      "0:00";


  document
    .getElementById("fill")
    .style
    .width =
      "0%";

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

document
  .getElementById("play")
  .addEventListener(
    "click",
    function(){

      if(
        !ready ||
        !player
      ){

        document
          .getElementById("song")
          .textContent =
            "YouTube is loading…";

        return;

      }


      const state =
        player.getPlayerState();


      /*
       * If playing, pause.
       */

      if(
        state ===
        YT.PlayerState.PLAYING
      ){

        player.pauseVideo();

        return;

      }


      /*
       * IMPORTANT:
       *
       * loadVideoById() is called from the
       * user's actual click.
       *
       * This avoids trying to autoplay
       * before user interaction.
       */

      player.loadVideoById({
        videoId:
          SONGS[currentIndex].id,

        startSeconds:0

      });


      player.playVideo();

    }
  );


/* =========================================================
   NEXT
========================================================= */

document
  .getElementById("next")
  .addEventListener(
    "click",
    function(){

      goTo(
        currentIndex + 1,
        true
      );

    }
  );


/* =========================================================
   PREVIOUS
========================================================= */

document
  .getElementById("prev")
  .addEventListener(
    "click",
    function(){

      goTo(
        currentIndex - 1,
        true
      );

    }
  );


/* =========================================================
   CHANGE SONG
========================================================= */

function goTo(
  index,
  autoplay
){

  currentIndex =
    (
      (
        index %
        SONGS.length
      ) +
      SONGS.length
    ) %
    SONGS.length;


  updateSong();


  if(
    !ready ||
    !player
  ){

    return;

  }


  stopTimer();


  player.loadVideoById({

    videoId:
      SONGS[currentIndex].id,

    startSeconds:0

  });


  if(autoplay){

    player.playVideo();

  }

}


/* =========================================================
   PROGRESS BAR CLICK
========================================================= */

document
  .getElementById("track")
  .addEventListener(
    "click",
    function(event){

      if(
        !ready ||
        !player
      ){

        return;

      }


      const duration =
        player.getDuration();


      if(
        !duration ||
        duration <= 0
      ){

        return;

      }


      const rect =
        event.currentTarget
          .getBoundingClientRect();


      const fraction =
        Math.min(
          1,
          Math.max(
            0,
            (
              event.clientX -
              rect.left
            ) /
            rect.width
          )
        );


      const time =
        fraction *
        duration;


      player.seekTo(
        time,
        true
      );


      document
        .getElementById("fill")
        .style
        .width =
          (
            fraction *
            100
          ) +
          "%";

    }
  );


/* =========================================================
   PROGRESS TIMER
========================================================= */

function startTimer(){

  stopTimer();


  timer =
    setInterval(
      function(){

        if(
          !player ||
          !ready
        ){

          return;

        }


        const current =
          player.getCurrentTime();


        const duration =
          player.getDuration();


        document
          .getElementById("cur")
          .textContent =
            formatTime(
              current
            );


        document
          .getElementById("dur")
          .textContent =
            formatTime(
              duration
            );


        if(
          duration > 0
        ){

          document
            .getElementById("fill")
            .style
            .width =
              (
                (
                  current /
                  duration
                ) *
                100
              ) +
              "%";

        }

      },
      250
    );

}


function stopTimer(){

  if(timer){

    clearInterval(timer);

    timer = null;

  }

}


function formatTime(
  seconds
){

  seconds =
    Math.floor(
      seconds || 0
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remaining =
    String(
      seconds % 60
    ).padStart(
      2,
      "0"
    );


  return (
    minutes +
    ":" +
    remaining
  );

}


/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

  const clock =
    document
      .getElementById("clock");


  if(!clock){

    return;

  }


  clock.textContent =
    new Date()
      .toLocaleTimeString(
        "en-IN",
        {
          hour:"numeric",
          minute:"2-digit"
        }
      )
      .toLowerCase();

}


updateClock();


setInterval(
  updateClock,
  1000
);


/* =========================================================
   START YOUTUBE
========================================================= */

loadYouTubeAPI();

</script>
