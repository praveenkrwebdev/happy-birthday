<style>

/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  min-height:100vh;

  font-family:
    "Noto Sans Devanagari",
    sans-serif;

  color:#fff;

  background:#070707;

  overflow-x:hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

.page{

  min-height:100vh;

  position:relative;

  isolation:isolate;

  overflow:hidden;

  background:

    linear-gradient(
      rgba(0,0,0,.60),
      rgba(0,0,0,.90)
    ),

    url("hero-desktop.webp");

  background-size:cover;

  background-position:center;

  background-attachment:fixed;
}


/* Dark overlay */

.page::before{

  content:"";

  position:absolute;

  inset:0;

  background:

    radial-gradient(
      circle at 50% 25%,
      rgba(255,122,0,.13),
      transparent 38%
    );

  pointer-events:none;

  z-index:-1;
}


/* Bottom fade */

.page::after{

  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:350px;

  background:
    linear-gradient(
      to bottom,
      transparent,
      #070707
    );

  pointer-events:none;

  z-index:-1;
}


/* =========================================================
   HEADER
========================================================= */

header{

  width:min(
    1180px,
    calc(100% - 32px)
  );

  margin:0 auto;

  padding:18px 0;

  display:flex;

  align-items:center;

  justify-content:space-between;

  position:relative;

  z-index:10;
}


.logo{

  font-size:17px;

  font-weight:800;

  letter-spacing:.3px;
}

.logo span{

  color:#ff7a00;
}


.clock{

  color:rgba(255,255,255,.65);

  font-size:13px;

  font-weight:500;

  padding:
    7px
    12px;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius:999px;

  background:
    rgba(255,255,255,.04);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);
}


/* =========================================================
   MAIN
========================================================= */

main{

  width:min(
    1180px,
    calc(100% - 32px)
  );

  margin:0 auto;

  position:relative;

  z-index:2;
}


/* =========================================================
   HERO
========================================================= */

.hero{

  min-height:58vh;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:
    60px
    20px
    110px;
}


.hero-content{

  max-width:720px;

  margin:auto;
}


/* Badge */

.badge{

  display:inline-flex;

  align-items:center;

  gap:8px;

  padding:
    7px
    13px;

  margin-bottom:22px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:999px;

  background:
    rgba(255,255,255,.055);

  backdrop-filter:
    blur(15px);

  -webkit-backdrop-filter:
    blur(15px);

  color:
    rgba(255,255,255,.75);

  font-size:12px;

  font-weight:600;
}


.badge::before{

  content:"";

  width:6px;

  height:6px;

  border-radius:50%;

  background:#ff7a00;

  box-shadow:
    0 0 12px
    rgba(255,122,0,.8);
}


/* Heading */

h1{

  font-size:
    clamp(
      42px,
      8vw,
      82px
    );

  line-height:1.05;

  font-weight:900;

  letter-spacing:-2px;

  text-shadow:
    0 10px 40px
    rgba(0,0,0,.65);
}


h1 span{

  color:#ff7a00;

  text-shadow:
    0 0 35px
    rgba(255,122,0,.18);
}


.subtitle{

  max-width:580px;

  margin:
    22px
    auto
    0;

  color:
    rgba(255,255,255,.68);

  font-size:
    clamp(
      14px,
      2vw,
      17px
    );

  line-height:1.9;

  font-weight:400;
}


/* =========================================================
   MUSIC PLAYER
========================================================= */

.music-section{

  padding:
    0
    0
    90px;
}


.player{

  width:min(
    680px,
    100%
  );

  margin:
    -45px
    auto
    0;

  padding:
    24px;

  border:
    1px solid
    rgba(255,255,255,.13);

  border-radius:28px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.095),
      rgba(255,255,255,.035)
    );

  box-shadow:

    0 30px 100px
    rgba(0,0,0,.55),

    inset 0 1px 0
    rgba(255,255,255,.08);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  transition:
    border-color .3s ease,
    box-shadow .3s ease;
}


.player.playing{

  border-color:
    rgba(255,122,0,.30);

  box-shadow:

    0 30px 100px
    rgba(0,0,0,.60),

    0 0 70px
    rgba(255,122,0,.06),

    inset 0 1px 0
    rgba(255,255,255,.08);
}


/* =========================================================
   SONG INFORMATION
========================================================= */

.song-info{

  display:flex;

  align-items:center;

  gap:16px;

  min-width:0;
}


/* Album */

.cover{

  width:68px;

  height:68px;

  flex:none;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:20px;

  background:

    linear-gradient(
      145deg,
      rgba(255,122,0,.95),
      rgba(255,64,0,.85)
    );

  color:#fff;

  font-size:27px;

  box-shadow:

    0 12px 35px
    rgba(255,90,0,.20);
}


.player.playing .cover{

  animation:
    pulse
    2s
    ease-in-out
    infinite;
}


.song-details{

  min-width:0;

  flex:1;
}


.song-title{

  font-size:19px;

  font-weight:800;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


.song-artist{

  margin-top:4px;

  color:
    rgba(255,255,255,.52);

  font-size:13px;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress{

  margin-top:25px;
}


.track{

  width:100%;

  height:5px;

  border-radius:99px;

  background:
    rgba(255,255,255,.10);

  cursor:pointer;

  overflow:hidden;
}


.fill{

  width:0%;

  height:100%;

  border-radius:inherit;

  background:#ff7a00;

  box-shadow:
    0 0 12px
    rgba(255,122,0,.45);

  transition:
    width .2s linear;
}


.time{

  display:flex;

  justify-content:space-between;

  margin-top:8px;

  color:
    rgba(255,255,255,.38);

  font-size:10px;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:12px;

  margin-top:23px;
}


.control{

  width:45px;

  height:45px;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius:50%;

  background:
    rgba(255,255,255,.055);

  color:#fff;

  display:flex;

  align-items:center;

  justify-content:center;

  cursor:pointer;

  font-family:inherit;

  font-size:17px;

  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease;
}


.control:hover{

  transform:translateY(-2px);

  background:
    rgba(255,255,255,.10);

  border-color:
    rgba(255,255,255,.18);
}


.control:active{

  transform:
    scale(.94);
}


.control.main{

  width:58px;

  height:58px;

  border-color:#ff7a00;

  background:#ff7a00;

  color:#111;

  font-size:21px;

  box-shadow:
    0 10px 30px
    rgba(255,122,0,.22);
}


.control.main:hover{

  background:#ff8b24;

  border-color:#ff8b24;
}


/* =========================================================
   HIDDEN YOUTUBE PLAYER
========================================================= */

.youtube-player{

  position:absolute;

  width:1px;

  height:1px;

  left:-9999px;

  top:-9999px;

  opacity:0;

  pointer-events:none;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
  text-align:center;

  padding:
    0
    20px
    45px;

  color:
    rgba(255,255,255,.30);

  font-size:11px;

  line-height:2;
}

.made-by{
  margin-top:5px;

  color:
    rgba(255,255,255,.45);
}

.heart{
  color:#ff4d6d;

  display:inline-block;

  margin:
    0
    3px;

  animation:
    heartBeat
    1.4s
    ease-in-out
    infinite;
}

.made-by a{
  color:#fff;

  text-decoration:none;

  font-weight:700;

  transition:
    color .2s ease;
}

.made-by a:hover{
  color:#ff7a00;
}

@keyframes heartBeat{

  0%,
  100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.18);
  }

}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes pulse{

  0%,
  100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.035);
  }

}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:768px){

  .page{

    background-image:

      linear-gradient(
        rgba(0,0,0,.62),
        rgba(0,0,0,.92)
      ),

      url("hero-mobile.webp");

    background-attachment:scroll;
  }


  header{

    width:
      calc(100% - 28px);

    padding-top:15px;
  }


  main{

    width:
      calc(100% - 28px);
  }


  .hero{

    min-height:55vh;

    padding:
      50px
      12px
      100px;
  }


  .player{

    margin-top:-40px;

    border-radius:24px;

    padding:20px;
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

  header{

    width:
      calc(100% - 24px);

    padding-top:13px;
  }


  .logo{

    font-size:15px;
  }


  .clock{

    font-size:11px;

    padding:
      6px
      10px;
  }


  main{

    width:
      calc(100% - 24px);
  }


  .hero{

    min-height:54vh;

    padding:
      35px
      8px
      90px;
  }


  .badge{

    font-size:10px;

    padding:
      6px
      11px;

    margin-bottom:18px;
  }


  h1{

    font-size:
      clamp(
        38px,
        13vw,
        56px
      );

    letter-spacing:-1.5px;
  }


  .subtitle{

    margin-top:18px;

    font-size:13px;

    line-height:1.8;
  }


  .music-section{

    padding-bottom:60px;
  }


  .player{

    margin-top:-35px;

    padding:18px;

    border-radius:22px;
  }


  .cover{

    width:58px;

    height:58px;

    border-radius:17px;

    font-size:23px;
  }


  .song-title{

    font-size:16px;
  }


  .song-artist{

    font-size:11px;
  }


  .controls{

    gap:10px;

    margin-top:20px;
  }


  .control{

    width:42px;

    height:42px;

    font-size:15px;
  }


  .control.main{

    width:55px;

    height:55px;

    font-size:19px;
  }


  footer{

    padding-bottom:30px;

    font-size:10px;
  }

}


/* =========================================================
   VERY SMALL DEVICES
========================================================= */

@media(max-width:340px){

  .hero{

    min-height:50vh;
  }


  .player{

    padding:15px;
  }


  .cover{

    width:52px;

    height:52px;
  }


  .song-title{

    font-size:14px;
  }

}

</style>

</head>

<header>

        id="prev"
        type="button"

      <button
        class="control main"
        id="play"
        type="button"
        aria-label="चलाएँ या रोकें"
      >
        ▶
      </button>


      <button
        class="control"
        id="next"
        type="button"
        aria-label="अगला गीत"
      >
        ⏭
      </button>

    </div>


  </div>

</section>


</main>



<!-- =======================================================

======================================================= -->

<footer>

</footer>

    id:"qDIQ6HXu5Rg",
    title:"अक्सर इस दुनिया में",
    artist:"अलका याग्निक"
  },

  {
    id:"IJNR_UVLDhs",
    title:"मैं निकला गड्डी लेके",
    artist:"उदित नारायण"
  }

];


/* =========================================================
   PLAYER VARIABLES
========================================================= */

let player = null;

let ready = false;

let currentIndex = 0;

let timer = null;


/* =========================================================
   YOUTUBE API
========================================================= */

function loadYouTubeAPI(){

  if(
    window.YT &&
    window.YT.Player
  ){

    createPlayer();

    return;
  }


  window.onYouTubeIframeAPIReady =
    function(){

      createPlayer();

    };


  if(
    !document.querySelector(
      'script[src="https://www.youtube.com/iframe_api"]'
    )
  ){

    const script =
      document.createElement("script");


    script.src =
      "https://www.youtube.com/iframe_api";


    script.async = true;


    document.head.appendChild(script);

  }

}


/* =========================================================
   CREATE PLAYER
========================================================= */

function createPlayer(){

  if(player){
    return;
  }


  player =
    new YT.Player(
      "yt",
      {

        width:"1",

        height:"1",

        videoId:
          SONGS[currentIndex].id,


        playerVars:{

          autoplay:0,

          controls:0,

          disablekb:1,

          playsinline:1,

          rel:0,

          modestbranding:1,

          iv_load_policy:3,

          enablejsapi:1,

          origin:
            window.location.origin

        },


        events:{

          onReady:function(){

            ready = true;

            updateSong();

          },


          onStateChange:function(event){

            const state =
              event.data;


            if(
              state ===
              YT.PlayerState.PLAYING
            ){

              document
                .body
                .classList
                .add("playing");


              document
                .getElementById("panel")
                .classList
                .add("playing");


              document
                .getElementById("play")
                .textContent =
                "⏸";


              startTimer();

            }


            else if(
              state ===
              YT.PlayerState.PAUSED
            ){

              stopPlaying();

            }


            else if(
              state ===
              YT.PlayerState.ENDED
            ){

              stopTimer();

              goTo(
                currentIndex + 1,
                true
              );

            }

          },


          onError:function(event){

            const errors = {

              2:
                "गीत उपलब्ध नहीं है।",

              5:
                "यूट्यूब प्लेयर में समस्या हुई।",

              100:
                "यह गीत उपलब्ध या सार्वजनिक नहीं है।",

              101:
                "यह गीत इस वेबसाइट पर चलाने की अनुमति नहीं देता।",

              150:
                "यह गीत इस वेबसाइट पर चलाने की अनुमति नहीं देता।",

              153:
                "यूट्यूब इस प्लेयर अनुरोध की पहचान नहीं कर सका।"

            };


            document
              .getElementById("song")
              .textContent =
              errors[event.data] ||
              "गीत चलाने में समस्या हुई।";


            document
              .getElementById("artist")
              .textContent =
              "यूट्यूब त्रुटि " +
              event.data;


            stopPlaying();


            console.error(
              "YouTube Error:",
              event.data
            );

          }

        }

      }
    );

}


/* =========================================================
   STOP PLAYING
========================================================= */

function stopPlaying(){

  document
    .body
    .classList
    .remove("playing");


  document
    .getElementById("panel")
    .classList
    .remove("playing");


  document
    .getElementById("play")
    .textContent =
    "▶";


  stopTimer();

}


/* =========================================================
   SONG INFORMATION
========================================================= */

function updateSong(){

  const song =
    SONGS[currentIndex];


  document
    .getElementById("song")
    .textContent =
    song.title;


  document
    .getElementById("artist")
    .textContent =
    song.artist;


  document
    .getElementById("cur")
    .textContent =
    "0:00";


  document
    .getElementById("dur")
    .textContent =
    "0:00";


  document
    .getElementById("fill")
    .style
    .width =
    "0%";

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

document
  .getElementById("play")
  .addEventListener(
    "click",
    function(){

      if(
        !ready ||
        !player
      ){

        document
          .getElementById("song")
          .textContent =
          "यूट्यूब लोड हो रहा है…";

        return;
      }


      const state =
        player.getPlayerState();


      if(
        state ===
        YT.PlayerState.PLAYING
      ){

        player.pauseVideo();

        return;

      }


      player.loadVideoById({

        videoId:
          SONGS[currentIndex].id,

        startSeconds:0

      });


      player.playVideo();

    }
  );


/* =========================================================
   NEXT
========================================================= */

document
  .getElementById("next")
  .addEventListener(
    "click",
    function(){

      goTo(
        currentIndex + 1,
        true
      );

    }
  );


/* =========================================================
   PREVIOUS
========================================================= */

document
  .getElementById("prev")
  .addEventListener(
    "click",
    function(){

      goTo(
        currentIndex - 1,
        true
      );

    }
  );


/* =========================================================
   CHANGE SONG
========================================================= */

function goTo(
  index,
  autoplay
){

  currentIndex =
    (
      (
        index %
        SONGS.length
      ) +
      SONGS.length
    ) %
    SONGS.length;


  updateSong();


  if(
    !ready ||
    !player
  ){

    return;

  }


  stopTimer();


  player.loadVideoById({

    videoId:
      SONGS[currentIndex].id,

    startSeconds:0

  });


  if(autoplay){

    player.playVideo();

  }

}


/* =========================================================
   PROGRESS CLICK
========================================================= */

document
  .getElementById("track")
  .addEventListener(
    "click",
    function(event){

      if(
        !ready ||
        !player
      ){

        return;

      }


      const duration =
        player.getDuration();


      if(
        !duration ||
        duration <= 0
      ){

        return;

      }


      const rect =
        event.currentTarget
          .getBoundingClientRect();


      const fraction =
        Math.min(
          1,
          Math.max(
            0,
            (
              event.clientX -
              rect.left
            ) /
            rect.width
          )
        );


      player.seekTo(
        fraction * duration,
        true
      );

    }
  );


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

  stopTimer();


  timer =
    setInterval(
      function(){

        if(
          !player ||
          !ready
        ){

          return;

        }


        const current =
          player.getCurrentTime();


        const duration =
          player.getDuration();


        document
          .getElementById("cur")
          .textContent =
          formatTime(current);


        document
          .getElementById("dur")
          .textContent =
          formatTime(duration);


        if(duration > 0){

          document
            .getElementById("fill")
            .style
            .width =
            (
              current /
              duration *
              100
            ) +
            "%";

        }

      },
      250
    );

}


function stopTimer(){

  if(timer){

    clearInterval(timer);

    timer = null;

  }

}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(seconds){

  seconds =
    Math.floor(
      seconds || 0
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remaining =
    String(
      seconds % 60
    ).padStart(
      2,
      "0"
    );


  return (
    minutes +
    ":" +
    remaining
  );

}


/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

  const clock =
    document.getElementById(
      "clock"
    );


  clock.textContent =
    new Date()
      .toLocaleTimeString(
        "hi-IN",
        {
          hour:"numeric",
          minute:"2-digit"
        }
      );

}


updateClock();


setInterval(
  updateClock,
  1000
);


/* =========================================================
   START
========================================================= */

loadYouTubeAPI();

</script>
