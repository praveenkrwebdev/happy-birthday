<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"

<title>Horn OK Please — Highway Music</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#070707;
  color:#fff;

  overflow-x:hidden;
}


/* =========================================================
   HEADER
========================================================= */

header{
  width:100%;
  padding:18px 24px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border-bottom:1px solid rgba(255,255,255,.08);

  background:rgba(0,0,0,.82);

  position:relative;
  z-index:20;

  backdrop-filter:blur(10px);
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:#ff7a00;
}

.clock{
  font-size:14px;
  color:#aaa;
}


/* =========================================================
   HERO
========================================================= */

.hero{

  min-height:72vh;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:50px 20px;

  position:relative;

  overflow:hidden;

  isolation:isolate;

  background-image:
    linear-gradient(
      rgba(0,0,0,.38),
      rgba(0,0,0,.68)
    ),
    url("hero-desktop.webp");

  background-size:cover;

  background-position:center;

  background-repeat:no-repeat;
}


/* Main orange glow */

.hero::before{

  content:"";

  position:absolute;

  inset:0;

  background:
    radial-gradient(
      circle at center,
      rgba(255,122,0,.14),
      transparent 55%
    );

  z-index:0;

  pointer-events:none;
}


/* Bottom fade */

.hero::after{

  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:180px;

  background:
    linear-gradient(
      to bottom,
      transparent,
      #070707
    );

  z-index:0;

  pointer-events:none;
}


/* =========================================================
   HERO CONTENT
========================================================= */

.hero-content{

  position:relative;

  z-index:5;

  max-width:850px;

  padding-bottom:50px;
}

.badge{

  display:inline-block;

  padding:8px 16px;

  border:1px solid rgba(255,122,0,.45);

  border-radius:999px;

  color:#ffad68;

  background:rgba(0,0,0,.35);

  backdrop-filter:blur(8px);

  font-size:12px;

  font-weight:700;

  letter-spacing:2px;

  margin-bottom:22px;

  box-shadow:
    0 0 30px rgba(255,122,0,.08);
}

h1{

  font-size:
    clamp(
      42px,
      8vw,
      90px
    );

  line-height:.95;

  font-weight:900;

  letter-spacing:-4px;

  text-transform:uppercase;

  text-shadow:
    0 5px 30px rgba(0,0,0,.75);
}

h1 span{
  color:#ff7a00;
}

.subtitle{

  margin-top:24px;

  color:#eee;

  font-size:17px;

  line-height:1.8;

  max-width:700px;

  margin-left:auto;
  margin-right:auto;

  text-shadow:
    0 2px 15px rgba(0,0,0,.95);
}


/* =========================================================
   TRUCK
========================================================= */

.hero-truck{

  position:absolute;

  left:-200px;

  bottom:55px;

  font-size:95px;

  z-index:3;

  filter:
    drop-shadow(
      0 12px 18px rgba(0,0,0,.8)
    )
    drop-shadow(
      0 0 25px rgba(255,122,0,.20)
    );

  animation:
    truckDrive
    22s
    linear
    infinite;

  pointer-events:none;
}

.hero-truck::after{

  content:"";

  position:absolute;

  width:190px;

  height:25px;

  left:8px;

  bottom:-6px;

  background:
    rgba(255,122,0,.30);

  filter:blur(18px);

  border-radius:50%;
}


/* =========================================================
   HORN
========================================================= */

.hero-horn{

  position:absolute;

  right:8%;

  top:17%;

  font-size:65px;

  z-index:2;

  opacity:.22;

  transform:rotate(-12deg);

  filter:
    drop-shadow(
      0 0 20px rgba(255,122,0,.55)
    );

  animation:
    hornFloat
    4s
    ease-in-out
    infinite;

  pointer-events:none;
}

.hero-horn::after{

  content:")))" ;

  position:absolute;

  left:65px;

  top:-5px;

  font-size:34px;

  font-weight:900;

  color:#ff7a00;

  letter-spacing:-7px;

  opacity:.7;

  animation:
    hornSound
    1.8s
    ease-in-out
    infinite;
}


/* =========================================================
   HORN TEXT
========================================================= */

.horn-text{

  position:absolute;

  right:10%;

  top:30%;

  color:#ff7a00;

  font-size:12px;

  font-weight:900;

  letter-spacing:3px;

  opacity:.45;

  transform:rotate(-8deg);

  z-index:2;

  pointer-events:none;
}


/* =========================================================
   HIGHWAY ROAD
========================================================= */

.hero-road{

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:95px;

  background:
    linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0,0,0,.15) 15%,
      rgba(0,0,0,.92) 75%
    );

  z-index:1;

  pointer-events:none;
}


/* Road markings */

.hero-road::before{

  content:"";

  position:absolute;

  left:0;
  right:0;

  top:62px;

  height:5px;

  background:
    repeating-linear-gradient(
      90deg,

      transparent 0,
      transparent 45px,

      rgba(255,255,255,.75) 45px,
      rgba(255,255,255,.75) 105px,

      transparent 105px,
      transparent 165px
    );

  animation:
    roadMove
    1.2s
    linear
    infinite;
}


/* Road orange glow */

.hero-road::after{

  content:"";

  position:absolute;

  left:50%;

  top:48px;

  width:80%;

  height:35px;

  transform:translateX(-50%);

  background:
    radial-gradient(
      ellipse,
      rgba(255,122,0,.24),
      transparent 70%
    );

  filter:blur(12px);
}


/* =========================================================
   HIGHWAY LIGHTS
========================================================= */

.highway-lights{

  position:absolute;

  left:0;
  right:0;

  bottom:98px;

  height:3px;

  background:
    repeating-linear-gradient(
      90deg,

      transparent 0,
      transparent 70px,

      rgba(255,122,0,.8) 70px,
      rgba(255,122,0,.8) 74px,

      transparent 74px,
      transparent 150px
    );

  opacity:.55;

  animation:
    lightsMove
    3s
    linear
    infinite;

  pointer-events:none;

  z-index:2;
}


/* =========================================================
   MUSIC SECTION
========================================================= */

.music-wrap{

  padding:
    0
    20px
    80px;

  position:relative;

  z-index:10;
}


/* =========================================================
   PLAYER PANEL
========================================================= */

.panel{

  max-width:760px;

  margin:
    -20px
    auto
    0;

  position:relative;

  z-index:5;

  background:
    rgba(17,17,17,.94);

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:24px;

  padding:28px;

  box-shadow:
    0 20px 80px rgba(0,0,0,.55);

  transition:.3s ease;

  backdrop-filter:blur(12px);
}

.panel.playing{

  border-color:
    rgba(255,122,0,.4);

  box-shadow:

    0 20px 80px rgba(0,0,0,.55),

    0 0 50px rgba(255,122,0,.08);
}


/* =========================================================
   NOW PLAYING
========================================================= */

.now-playing{

  display:flex;

  align-items:center;

  gap:18px;
}

.cover{

  width:72px;
  height:72px;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      #ff7a00,
      #ff3d00
    );

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:30px;

  flex:none;

  box-shadow:
    0 10px 30px
    rgba(255,90,0,.20);
}

.info{

  min-width:0;

  flex:1;
}

.song{

  font-size:20px;

  font-weight:800;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.artist{

  color:#999;

  margin-top:5px;

  font-size:14px;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-area{
  margin-top:28px;
}

.track{

  width:100%;

  height:6px;

  border-radius:99px;

  background:#292929;

  cursor:pointer;

  overflow:hidden;
}

.fill{

  height:100%;

  width:0%;

  background:#ff7a00;

  border-radius:inherit;

  transition:
    width .15s linear;
}

.time-row{

  display:flex;

  justify-content:space-between;

  margin-top:8px;

  font-size:11px;

  color:#777;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:16px;

  margin-top:25px;
}

.control{

  width:48px;
  height:48px;

  border-radius:50%;

  border:
    1px solid
    rgba(255,255,255,.12);

  background:#191919;

  color:#fff;

  cursor:pointer;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:18px;

  transition:.2s ease;
}

.control:hover{

  background:#242424;

  transform:
    translateY(-2px);
}

.control.main{

  width:62px;
  height:62px;

  background:#ff7a00;

  border-color:#ff7a00;

  color:#000;

  font-size:22px;
}

.control.main:hover{
  background:#ff8c24;
}


/* =========================================================
   YOUTUBE PLAYER
========================================================= */

.youtube-player{

  position:absolute;

  width:1px;
  height:1px;

  left:-10000px;
  top:-10000px;

  opacity:0;

  pointer-events:none;
}


/* =========================================================
   FOOTER
========================================================= */

footer{

  padding:
    40px
    20px
    60px;

  text-align:center;

  color:#555;

  font-size:12px;
}


/* =========================================================
   PLAYING ANIMATION
========================================================= */

body.playing .cover{

  animation:
    coverPulse
    1.8s
    ease-in-out
    infinite;
}

@keyframes coverPulse{

  0%,
  100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.04);
  }
}


/* =========================================================
   TRUCK ANIMATION
========================================================= */

@keyframes truckDrive{

  0%{
    transform:
      translateX(0)
      translateY(0);
  }

  25%{
    transform:
      translateX(25vw)
      translateY(-2px);
  }

  50%{
    transform:
      translateX(50vw)
      translateY(0);
  }

  75%{
    transform:
      translateX(75vw)
      translateY(-2px);
  }

  100%{
    transform:
      translateX(
        calc(100vw + 220px)
      )
      translateY(0);
  }
}


/* =========================================================
   HORN FLOAT
========================================================= */

@keyframes hornFloat{

  0%,
  100%{
    transform:
      rotate(-12deg)
      translateY(0);
  }

  50%{
    transform:
      rotate(-8deg)
      translateY(-10px);
  }
}


/* =========================================================
   HORN SOUND
========================================================= */

@keyframes hornSound{

  0%{
    opacity:.1;

    transform:
      translateX(0);
  }

  50%{
    opacity:.8;

    transform:
      translateX(12px);
  }

  100%{
    opacity:.1;

    transform:
      translateX(25px);
  }
}


/* =========================================================
   ROAD MOVEMENT
========================================================= */

@keyframes roadMove{

  from{
    background-position:0 0;
  }

  to{
    background-position:-165px 0;
  }
}


/* =========================================================
   LIGHT MOVEMENT
========================================================= */

@keyframes lightsMove{

  from{
    background-position:0 0;
  }

  to{
    background-position:-300px 0;
  }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  header{
    padding:16px;
  }


  .hero{

    min-height:65vh;

    padding:
      40px
      16px;

    background-image:

      linear-gradient(
        rgba(0,0,0,.40),
        rgba(0,0,0,.68)
      ),

      url("hero-mobile.webp");

    background-position:center;

    background-size:cover;
  }


  .hero-content{
    padding-bottom:30px;
  }


  h1{
    letter-spacing:-2px;
  }


  .subtitle{

    font-size:15px;

    line-height:1.7;
  }


  .panel{

    padding:20px;

    border-radius:20px;
  }


  .cover{

    width:60px;
    height:60px;

    font-size:25px;
  }


  .song{
    font-size:17px;
  }


  .hero-truck{

    font-size:65px;

    bottom:42px;
  }


  .hero-horn{

    right:5%;

    top:14%;

    font-size:42px;

    opacity:.15;
  }


  .hero-horn::after{

    left:42px;

    font-size:24px;
  }


  .horn-text{

    right:7%;

    top:25%;

    font-size:9px;
  }


  .hero-road{
    height:70px;
  }


  .hero-road::before{
    top:48px;
  }


  .highway-lights{
    bottom:72px;
  }

}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  .hero-truck,
  .hero-horn,
  .hero-horn::after,
  .hero-road::before,
  .highway-lights,
  body.playing .cover{

    animation:none;
  }

}

</style>

</head>

let player = null;

/* =========================================================

========================================================= */

function loadYouTubeAPI(){

  if(
    window.YT &&
    window.YT.Player
  ){

    createPlayer();

    return;
  }


  window.onYouTubeIframeAPIReady =
    function(){

      createPlayer();

    };


  if(
    !document.querySelector(
      'script[src="https://www.youtube.com/iframe_api"]'
    )
  ){

    const script =
      document.createElement("script");


    script.src =
      "https://www.youtube.com/iframe_api";


    script.async = true;


    document.head.appendChild(
      script
    );

  }

}



/* =========================================================

========================================================= */

function createPlayer(){

  if(player){
    return;
  }


  player =
    new YT.Player(
      "yt",
      {

        width:"1",

        height:"1",

        videoId:
          SONGS[currentIndex].id,


        playerVars:{

          autoplay:0,

          controls:0,

          disablekb:1,

        },


        events:{

          onReady:function(){

            ready = true;

            updateSong();


            document
              .getElementById("play")
              .textContent = "▶";


            console.log(
              "YouTube player ready"
            );

          },


          onStateChange:function(
            event
          ){

            const state =
              event.data;


            /* PLAYING */

            if(
              state ===
              YT.PlayerState.PLAYING
            ){

              document
                .body
                .classList
                .add("playing");


              document
                .getElementById("panel")
                .classList
                .add("playing");


              document
                .getElementById("play")
                .textContent = "⏸";


              startTimer();

            }


            /* PAUSED */

            else if(
              state ===
              YT.PlayerState.PAUSED
            ){

              document
                .body
                .classList
                .remove("playing");


              document
                .getElementById("panel")
                .classList
                .remove("playing");


              document
                .getElementById("play")
                .textContent = "▶";


              stopTimer();

            }


            /* ENDED */

            else if(
              state ===
              YT.PlayerState.ENDED
            ){

              stopTimer();


              goTo(
                currentIndex + 1,
                true
              );

            }

          },


          /* YOUTUBE ERRORS */

          onError:function(
            event
          ){

            const errors = {

              2:
                "Invalid YouTube video ID.",

              5:
                "YouTube HTML5 player error.",

              100:
                "Video unavailable or private.",

              101:
                "This video does not allow embedded playback.",

              150:
                "This video does not allow embedded playback.",

              153:
                "YouTube could not identify the embedding request."

            };


            const message =
              errors[event.data] ||
              "YouTube playback error.";


            document
              .getElementById("song")
              .textContent =
                message;


            document
              .getElementById("artist")
              .textContent =
                "YouTube error " +
                event.data;


            document
              .getElementById("play")
              .textContent = "▶";


            document
              .body
              .classList
              .remove("playing");


            document
              .getElementById("panel")
              .classList
              .remove("playing");


            stopTimer();


            console.error(
              "YouTube error:",
              event.data,
              message
            );

          }

        }

      }
    );

}



/* =========================================================
   UPDATE SONG
========================================================= */

function updateSong(){

  const song =
    SONGS[currentIndex];


  document
    .getElementById("song")
    .textContent =
      song.title;


  document
    .getElementById("artist")
    .textContent =
      song.artist;


  document
    .getElementById("cur")
    .textContent =
      "0:00";


  document
    .getElementById("dur")
    .textContent =
      "0:00";


  document
    .getElementById("fill")
    .style
    .width =
      "0%";

}



/* =========================================================
   PLAY / PAUSE
========================================================= */

document
  .getElementById("play")
  .addEventListener(
    "click",
    function(){

      if(
        !ready ||
        !player
      ){

        document
          .getElementById("song")
          .textContent =
            "YouTube लोड हो रहा है…";

        return;
      }


      const state =
        player.getPlayerState();


      if(
        state ===
        YT.PlayerState.PLAYING
      ){

        player.pauseVideo();

        return;
      }


      player.loadVideoById({

        videoId:
          SONGS[currentIndex].id,

        startSeconds:0

      });


      player.playVideo();

    }
  );



/* =========================================================
   NEXT
========================================================= */

document
  .getElementById("next")
  .addEventListener(
    "click",
    function(){

      goTo(
        currentIndex + 1,
        true
      );

    }
  );



/* =========================================================
   PREVIOUS
========================================================= */

document
  .getElementById("prev")
  .addEventListener(
    "click",
    function(){

      goTo(
        currentIndex - 1,
        true
      );

    }
  );



/* =========================================================
   CHANGE SONG
========================================================= */

function goTo(
  index,
  autoplay
){

  currentIndex =
    (
      (
        index %
        SONGS.length
      ) +
      SONGS.length
    ) %
    SONGS.length;


  updateSong();


  if(
    !ready ||
    !player
  ){

    return;
  }


  stopTimer();


  player.loadVideoById({

    videoId:
      SONGS[currentIndex].id,

    startSeconds:0

  });


  if(autoplay){

    player.playVideo();

  }

}



/* =========================================================
   PROGRESS BAR
========================================================= */

document
  .getElementById("track")
  .addEventListener(
    "click",
    function(event){

      if(
        !ready ||
        !player
      ){

        return;
      }


      const duration =
        player.getDuration();


      if(
        !duration ||
        duration <= 0
      ){

        return;
      }


      const rect =
        event.currentTarget
          .getBoundingClientRect();


      const fraction =
        Math.min(
          1,
          Math.max(
            0,
            (
              event.clientX -
              rect.left
            ) /
            rect.width
          )
        );


      const time =
        fraction *
        duration;


      player.seekTo(
        time,
        true
      );


      document
        .getElementById("fill")
        .style
        .width =
          (
            fraction *
            100
          ) +
          "%";

    }
  );



/* =========================================================
   TIMER
========================================================= */

function startTimer(){

  stopTimer();


  timer =
    setInterval(
      function(){

        if(
          !player ||
          !ready
        ){

          return;
        }


        const current =
          player.getCurrentTime();


        const duration =
          player.getDuration();


        document
          .getElementById("cur")
          .textContent =
            formatTime(
              current
            );


        document
          .getElementById("dur")
          .textContent =
            formatTime(
              duration
            );


        if(
          duration > 0
        ){

          document
            .getElementById("fill")
            .style
            .width =
              (
                (
                  current /
                  duration
                ) *
                100
              ) +
              "%";

        }

      },
      250
    );

}


function stopTimer(){

  if(timer){

    clearInterval(timer);

    timer = null;

  }

}


function formatTime(
  seconds
){

  seconds =
    Math.floor(
      seconds || 0
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remaining =
    String(
      seconds % 60
    ).padStart(
      2,
      "0"
    );


  return (
    minutes +
    ":" +
    remaining
  );

}



/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

  const clock =
    document
      .getElementById("clock");


  if(!clock){
    return;
  }


  clock.textContent =
    new Date()
      .toLocaleTimeString(
        "en-IN",
        {
          hour:"numeric",
          minute:"2-digit"
        }
      )
      .toLowerCase();

}


updateClock();


setInterval(
  updateClock,
  1000
);



/* =========================================================
   START YOUTUBE
========================================================= */

loadYouTubeAPI();

</script>
